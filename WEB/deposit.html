<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Depositar Fondos - Money Solutions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary shadow-sm mb-5">
        <div class="container">
            <a class="navbar-brand" href="menu.html">← Volver al Menú</a>
        </div>
    </nav>

    <main class="container">
        <section class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm p-4">
                    <h3 class="text-center mb-4 text-primary">Realizar Depósito</h3>
                    <form id="depositForm">
                        <div class="mb-3">
                            <label for="montoDeposito" class="form-label">Monto a depositar</label>
                            <input type="number" class="form-control form-control-lg" id="montoDeposito" placeholder="$ 0.00" required>
                        </div>
                        <button type="button" id="btnDepositar" class="btn btn-success btn-lg w-100">Confirmar Depósito</button>
                    </form>
                    <div id="mensajeDeposito" class="mt-3 text-center"></div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
