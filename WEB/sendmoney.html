<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Dinero - Money Solutions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary shadow-sm mb-5">
        <div class="container">
            <a class="navbar-brand" href="menu.html">← Volver al Menú</a>
        </div>
    </nav>

    <main class="container">
        <section class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm p-4">
                    <h3 class="text-center mb-4 text-primary">Transferir Fondos</h3>
                    <form id="transferForm">
                        <!-- Campo para autocompletar con jQuery -->
                        <div class="mb-3">
                            <label for="buscarContacto" class="form-label">Buscar Contacto</label>
                            <input type="text" class="form-control" id="buscarContacto" placeholder="Nombre o email">
                        </div>
                        <div class="mb-4">
                            <label for="montoTransferencia" class="form-label">Monto</label>
                            <input type="number" class="form-control" id="montoTransferencia" placeholder="$ 0.00" required>
                        </div>
                        <button type="button" class="btn btn-primary w-100 mb-2">Transferir</button>
                        <button type="button" class="btn btn-outline-secondary w-100">Agregar nuevo contacto</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
