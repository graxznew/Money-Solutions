<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial - Money Solutions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary shadow-sm mb-5">
        <div class="container">
            <a class="navbar-brand" href="menu.html">← Volver al Menú</a>
        </div>
    </nav>

    <main class="container">
        <section class="card shadow-sm p-4">
            <h3 class="mb-4 text-primary border-bottom pb-2">Últimos Movimientos</h3>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Fecha</th>
                            <th>Descripción</th>
                            <th>Tipo</th>
                            <th class="text-end">Monto</th>
                        </tr>
                    </thead>
                    <tbody id="listaTransacciones">
                        <!-- Ejemplo de datos -->
                        <tr>
                            <td>01/09/2026</td>
                            <td>Transferencia a mi hermano</td>
                            <td><span class="badge bg-danger">Envío</span></td>
                            <td class="text-end text-danger">-$1,500.00</td>
                        </tr>
                        <tr>
                            <td>01/09/2026</td>
                            <td>Transferencia a Camila</td>
                            <td><span class="badge bg-danger">Envío</span></td>
                            <td class="text-end text-danger">-$5,000.00</td>
                        </tr>
                        <tr>
                            <td>30/08/2026</td>
                            <td>Depósito en efectivo</td>
                            <td><span class="badge bg-success">Ingreso</span></td>
                            <td class="text-end text-success">+$5,000.00</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
